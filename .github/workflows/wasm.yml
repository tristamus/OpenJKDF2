name: WebAssembly

on:
  push:
    branches:
      - web-mp
  pull_request:
    branches:
      - web-mp

jobs:
  build:

    runs-on: ubuntu-24.04

    env:
      EMSDK_VERSION: 6.0.12
    steps:
      - uses: actions/checkout@v4
        name: Checkout
      # The WASM target only builds zlib and libpng from submodules; SDL3, OpenAL
      # and GL come from Emscripten itself.
      - name: Checkout submodules
        run: git submodule update --init --depth 1 lib/zlib lib/libpng
      - name: Install Emscripten
        run: |
          git clone --depth 1 https://github.com/emscripten-core/emsdk.git "$RUNNER_TEMP/emsdk"
          "$RUNNER_TEMP/emsdk/emsdk" install "$EMSDK_VERSION"
          "$RUNNER_TEMP/emsdk/emsdk" activate "$EMSDK_VERSION"
      - name: Generate CMake Build System
        run: |
          source "$RUNNER_TEMP/emsdk/emsdk_env.sh"
          cmake -B build_emcc --toolchain cmake_modules/toolchain_wasm.cmake
      - name: Make
        run: |
          source "$RUNNER_TEMP/emsdk/emsdk_env.sh"
          make -C build_emcc -j"$(nproc)"
      # The JSPI engine, which the page loads where the browser has JSPI
      # (cmake_modules/toolchain_wasm.cmake), from the same source.
      - name: Make the JSPI engine
        run: |
          source "$RUNNER_TEMP/emsdk/emsdk_env.sh"
          cmake -B build_emcc_jspi --toolchain cmake_modules/toolchain_wasm.cmake -DOPENJKDF2_WASM_JSPI=ON
          make -C build_emcc_jspi -j"$(nproc)"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # The JSPI engine: no invoke_* or JavaScript exception imports (a
      # JavaScript frame under a pause), only the expected imports can pause,
      # only main is promising, and no other export reaches a pause through
      # direct calls (jspi-check.mjs; callbacks through function pointers
      # aren't followed).
      - name: Check the JSPI engine
        run: |
          source "$RUNNER_TEMP/emsdk/emsdk_env.sh"
          node packaging/wasm/test/jspi-check.mjs build_emcc_jspi --reach "$(em-config BINARYEN_ROOT)/bin/wasm-dis"
      # Map downloads for joiners, with made-up GOBs (no game files).
      - name: Test map downloads
        run: node packaging/wasm/test/maps-test.mjs
      # The host's mod for joiners, with made-up files (no game files).
      - name: Test mod sharing
        run: node packaging/wasm/test/mods-test.mjs
      # The page's mod list and zipped mods, with made-up files.
      - name: Test the mod list
        run: node packaging/wasm/test/picker-test.mjs
      # unzip.js, the zip methods the browser can't unpack: zips made by
      # PKZIP, 7-Zip, xz, zstd and others (packaging/wasm/test/fixtures).
      - name: Test unzipping
        run: node packaging/wasm/test/unzip-test.mjs
      # Screenshots: storing them, their names and the zip, with made-up pictures.
      - name: Test screenshots
        run: node packaging/wasm/test/screenshots-test.mjs
      # The graphics acceleration and Edge enhanced security notices, with a
      # made-up browser.
      - name: Test the graphics acceleration and enhanced security notices
        run: node packaging/wasm/test/graphics-test.mjs
      # The tab's icon: in the page, in the page's colors.
      - name: Test the tab's icon
        run: node packaging/wasm/test/icon-test.mjs
      # The engine failing to start or stopping: only its own errors show the
      # box with Reload, with made-up errors from the engine and elsewhere.
      - name: Test the engine's error box
        run: node packaging/wasm/test/errors-test.mjs
      # Quit: back to the lobby once the saves are stored, with made-up storage.
      - name: Test Quit
        run: node packaging/wasm/test/quit-test.mjs
      # The room list: every room opens its game's room window.
      - name: Test the room list
        run: node packaging/wasm/test/rooms-test.mjs
      # The Raw mouse input box: how it starts in each browser (ticked for a
      # new Firefox player on Windows) and what it says, with made-up browsers
      # and storage.
      - name: Test the Raw mouse input box
        run: node packaging/wasm/test/raw-mouse-test.mjs
      # Keys: every key of a standard keyboard reaches the game, and the
      # default binds, read from the sources.
      - name: Test keys and default binds
        run: node packaging/wasm/test/keys-test.mjs
      # Frame times read from the game, the slow-frame note and ?bench, with
      # made-up frames and browsers.
      - name: Test frame times, the slow-frame note and ?bench
        run: node packaging/wasm/test/frames-test.mjs
      # Network measurements, the hit ledger and ?netsim, with made-up games
      # and links.
      - name: Test network measurements
        run: node packaging/wasm/test/netstats-test.mjs
      # The network code's own JavaScript (stdComm_WSRelay.c): the fast lane
      # for positions, the switch to a link and back, links between joiners
      # and TURN credentials, with made-up browsers, WebRTC and lobby.
      - name: Test network paths
        run: node packaging/wasm/test/transport-test.mjs
      # Joining a room with a password, in C with the tree's own list, join
      # and reply code cut out of stdComm_WSRelay.c: what the join sends of
      # the password and logs, and what the lobby's answers become.
      - name: Test joining a room with a password
        run: sh packaging/wasm/test/passwords-test.sh
      # A host's map upload to a player joining mid-match, over a modelled
      # upload with queues the page can't see, through the lobby, over the
      # map channel and on the Imperial Network Protocol: the map comes, sent
      # once and soon at a fast upload's speed, and the host's game packets
      # don't wait behind it as they do with the live build's.
      - name: Test paced map uploads
        run: node packaging/wasm/test/pacing-test.mjs
      # The Imperial Network Protocol's transfer pump, on its own in C, with
      # a made-up queue and socket: its 1 MiB/s ceiling, and nothing while
      # the socket has 16 KiB waiting. Then the request it times on the relay
      # server, at most one each 2 s once the server has answered.
      - name: Test the Imperial transfer pump
        run: node packaging/wasm/test/xferpump-test.mjs
      # Hit what you see's check on a hit claim, on its own in C, with
      # made-up records of where a player was and made-up claims.
      - name: Test the hit claim check
        run: |
          cc -std=c11 -O2 -Wall -Werror -o hitcheck-test packaging/wasm/test/hitcheck-test.c \
             src/Platform/Networking/WSRelay/stdComm_WSRelayHitCheck.c -lm
          ./hitcheck-test
      # Hit what you see's buffer of another player's timed updates, on its
      # own in C: the delay it draws them at over steady, jittery, lossy and
      # changing links, where it puts them between and past updates, and
      # their messages that wait for the moment they're drawn at.
      - name: Test drawing other players from their timed updates
        run: |
          cc -std=c11 -O2 -Wall -Werror -o motion-test packaging/wasm/test/motion-test.c \
             src/Platform/Networking/WSRelay/stdComm_WSRelayPlayout.c -lm
          ./motion-test
      # The resend buffer for reliable game messages, in C with the tree's
      # own code and made-up games and network: acks for every message id,
      # the count of messages waiting, resends and when they stop, a player
      # index that changes hands, and how a receiver acks and drops repeats.
      - name: Test reliable messages
        run: sh packaging/wasm/test/sithcomm-test.sh
      # Engine and page only. No game files are ever part of this artifact:
      # players pick their own install folder in the page.
      - name: Collect web build
        run: |
          mkdir -p web/jspi
          cp packaging/wasm/index.html packaging/wasm/move-out.html packaging/wasm/unzip.js build_emcc/openjkdf2.js \
             build_emcc/openjkdf2.wasm web/
          cp build_emcc_jspi/openjkdf2.js build_emcc_jspi/openjkdf2.wasm web/jspi/
      - uses: actions/upload-artifact@v4
        with:
          name: openjkdf2-wasm
          path: web/
